name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional notes for the release
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build module
        run: npm run build

      - name: Capture release version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Zip dist directory
        shell: bash
        run: |
          cd dist
          zip -r ../module.zip ./*

      - name: Create version release
        shell: bash
        run: |
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" ./dist/module.json ./module.zip --clobber
            gh release edit "$VERSION" --title "Release $VERSION" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$VERSION" ./dist/module.json ./module.zip --title "Release $VERSION" --notes "$RELEASE_NOTES" --target "$GITHUB_SHA" --latest
          fi
