name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional notes for the release
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build module
        run: npm run build

      - name: Get version from package.json
        id: get_version
        shell: bash
        run: |
          echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Zip dist directory
        shell: bash
        run: |
          cd dist
          zip -r ../module.zip ./*

      - name: Update latest release
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ./dist/module.json ./module.zip --clobber
            gh release edit latest --title "Latest" --notes "$RELEASE_NOTES" --latest
          else
            gh release create latest ./dist/module.json ./module.zip --title "Latest" --notes "$RELEASE_NOTES" --target "$GITHUB_SHA" --latest
          fi

      - name: Create version release
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" ./dist/module.json ./module.zip --clobber
            gh release edit "$VERSION" --title "Release $VERSION" --notes "$RELEASE_NOTES"
          else
            gh release create "$VERSION" ./dist/module.json ./module.zip --title "Release $VERSION" --notes "$RELEASE_NOTES" --target "$GITHUB_SHA" --latest=false
          fi
