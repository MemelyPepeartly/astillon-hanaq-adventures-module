name: Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compilation is packaging, not real Foundry functional acceptance.
      - name: Package module (no automated test suites)
        run: npm run build
