schema_version: "1.0"
preset:
  id: "astillon-foundry"
  name: "Astillon Foundry workflow"
  version: "1.0.0"
  description: "Performance-first, GM-controlled Foundry development without automated tests."
  author: "Astillon Hanaq Adventures"
requires:
  speckit_version: "==1.4.3"
provides:
  templates:
    - type: "command"
      name: "speckit.analyze"
      file: "speckit.analyze.md"
    - type: "command"
      name: "speckit.checklist"
      file: "speckit.checklist.md"
    - type: "command"
      name: "speckit.clarify"
      file: "speckit.clarify.md"
    - type: "command"
      name: "speckit.constitution"
      file: "speckit.constitution.md"
    - type: "command"
      name: "speckit.converge"
      file: "speckit.converge.md"
    - type: "command"
      name: "speckit.implement"
      file: "speckit.implement.md"
    - type: "command"
      name: "speckit.plan"
      file: "speckit.plan.md"
    - type: "command"
      name: "speckit.specify"
      file: "speckit.specify.md"
    - type: "command"
      name: "speckit.tasks"
      file: "speckit.tasks.md"
